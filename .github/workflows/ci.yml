name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install -e ".[dev]"
      - name: Doctor JSON preflight smoke
        run: |
          set +e
          dcc-mcp-tiled-doctor doctor --json \
            --executable "${RUNNER_TEMP}/missing-tiled" > doctor.json
          exit_code=$?
          set -e
          test "$exit_code" -eq 10
          python -c 'import json; from dcc_mcp_core.deployment import load_install_sop_schema; from jsonschema import Draft202012Validator; schema=load_install_sop_schema(); report=json.load(open("doctor.json", encoding="utf-8")); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(report); assert report["schema_version"] == 1; assert report["exit_code"] == 10; assert report["directly_usable"] is False'
      - run: python -m pytest
      - run: python -m ruff check src tests tools
      - run: python -m ruff format --check src tests tools
      - run: python tools/lint_skills.py
      - run: python -m build
      - if: matrix.python-version == '3.12'
        run: python -m twine check dist/*

  core-cli-floor:
    runs-on: ubuntu-latest
    env:
      CORE_CLI_VERSION: "0.20.14"
      CORE_CLI_SHA256: "312bc63f744b62c34ccd48405f77d900d0a8a6d0b7dd18cddfaa4cb34aa4cb56"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install "dcc-mcp-core==${CORE_CLI_VERSION}" -e ".[dev]"
      - name: Download verified Core CLI floor
        run: |
          curl --fail --location --output "${RUNNER_TEMP}/dcc-mcp-cli" \
            "https://github.com/dcc-mcp/dcc-mcp-core/releases/download/v${CORE_CLI_VERSION}/dcc-mcp-cli-linux-x86_64"
          echo "${CORE_CLI_SHA256}  ${RUNNER_TEMP}/dcc-mcp-cli" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/dcc-mcp-cli"
      - name: Execute the declared-floor Tiled catalog plan
        env:
          DCC_MCP_TILED_CORE_FLOOR_CLI: "${{ runner.temp }}/dcc-mcp-cli"
        run: |
          python -m pytest -q \
            tests/test_install.py::test_declared_core_floor_cli_executes_the_emitted_catalog_plan \
            tests/test_install.py::test_driver_missing_binds_the_official_floor_cli_to_python_core

  tiled-live:
    runs-on: ubuntu-latest
    env:
      TILED_VERSION: "1.12.2"
      TILED_SHA256: "5e0edbff61314f41af3c72c21ec006b363cf12047cc9cfb5bbd63a98bca3721c"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install adapter
        run: python -m pip install -e ".[dev]"
      - name: Download verified official Tiled AppImage
        run: |
          curl --fail --location --output tiled.AppImage \
            "https://github.com/mapeditor/tiled/releases/download/v${TILED_VERSION}/Tiled-${TILED_VERSION}_Linux_x86_64.AppImage"
          echo "${TILED_SHA256}  tiled.AppImage" | sha256sum --check --strict
          chmod +x tiled.AppImage
      - name: Install AppImage and virtual display runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libglib2.0-0 libx11-6 libxcb1 libxkbcommon-x11-0 libgl1 libegl1 \
            libfontconfig1 libxcb-cursor0 xvfb xauth
      - name: Run native Tiled typed smoke
        env:
          DCC_MCP_TILED_EXECUTABLE: "${{ github.workspace }}/tiled.AppImage"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          DISPLAY=:99 dcc-mcp-tiled-doctor verify --json > doctor.json
          python -c 'import json; from dcc_mcp_core.deployment import load_install_sop_schema; from jsonschema import Draft202012Validator; schema=load_install_sop_schema(); report=json.load(open("doctor.json", encoding="utf-8")); Draft202012Validator.check_schema(schema); Draft202012Validator(schema).validate(report); assert report["exit_code"] == 0; assert report["directly_usable"] is True; assert report["runtime"]["version"] == "1.12.2"'
          DISPLAY=:99 python tests/live_tiled_smoke.py
