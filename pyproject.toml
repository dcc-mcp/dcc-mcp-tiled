[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-tiled"
version = "0.2.0"
description = "Tiled adapter for the DCC Model Context Protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "loonghao", email = "hal.long@outlook.com" }]
keywords = ["tiled", "image-editing", "mcp", "dcc", "automation"]
dependencies = ["dcc-mcp-core>=0.19.38,<1.0.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8", "twine>=6"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-tiled"
Repository = "https://github.com/dcc-mcp/dcc-mcp-tiled"
Issues = "https://github.com/dcc-mcp/dcc-mcp-tiled/issues"

[project.scripts]
dcc-mcp-tiled = "dcc_mcp_tiled.server:main"
dcc-mcp-tiled-install = "dcc_mcp_tiled.install:main"

[project.entry-points."dcc_mcp.adapters"]
tiled = "dcc_mcp_tiled:TiledMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_tiled"]
artifacts = ["src/dcc_mcp_tiled/skills/**"]

[tool.hatch.build.targets.wheel.force-include]
"bridge/tiled-plugin/dcc_mcp_tiled.py" = "dcc_mcp_tiled/tiled_plugin/dcc_mcp_tiled.py"

[tool.hatch.build.targets.sdist]
include = ["src/dcc_mcp_tiled", "bridge", "tests", "README.md", "LICENSE", "CHANGELOG.md", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
